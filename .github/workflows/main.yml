# Publishes the site to GitHub Pages on every push to main.
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# There is no build step. The workflow copies the committed files (minus
# README.md and dotfiles), writes the last-updated date into the footer,
# and deploys.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Collect site files
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -f _site/README.md

      - name: Check that resume.pdf exists
        run: |
          if [ ! -f resume.pdf ]; then
            echo "::warning::resume.pdf is missing, so the resume link on the site is broken. Add resume.pdf to the top folder of the repo."
          fi

      - name: Add last-updated date to the footer
        run: |
          DATE=$(git log -1 --format=%cs)
          PRETTY=$(date -d "$DATE" '+%b %-d, %Y')
          STAMP="Updated <time datetime=\"$DATE\">$PRETTY</time> (<a href=\"https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA\">${GITHUB_SHA::7}</a>)."
          sed -i "s|<!-- build -->|$STAMP|" _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
